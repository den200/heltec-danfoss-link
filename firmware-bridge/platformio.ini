[platformio]
default_envs = heltec_v3

[env:heltec_v3]
platform = platformio/espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<nvs_bench.cpp> -<capture.cpp>
monitor_speed = 115200
extra_scripts = pre:scripts/network_key.py
board_build.f_cpu = 240000000L
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
lib_deps =
  jgromes/RadioLib @ ^7.1.2
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1

; Storage-only bench: no radio initialization or transmission, isolated namespace.
[env:nvs_bench]
extends = env:heltec_v3
build_src_filter = -<*> +<nvs_bench.cpp>
lib_deps =

; Receive-only capture for a new installation: finds the Home ID and the network key
; during a pairing (docs/GETTING-STARTED.md). Needs no key and no Wi-Fi settings.
[env:capture]
extends = env:heltec_v3
extra_scripts =
build_src_filter = -<*> +<capture.cpp>
lib_deps =
  jgromes/RadioLib @ ^7.1.2
